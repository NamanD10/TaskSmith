services:

  postgres:
    image: postgres:15-alpine3.23 
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER} 
      POSTGRES_PASSWORD: ${DB_PASSWORD} 
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 10
  
  redis:
    image: redis:7.4.12-alpine3.21
    ports:
      - "6379:6379"

  migrate: 
    build: .
    env_file:
      - .env.docker
    command: npx drizzle-kit push --force
    depends_on:
      postgres: 
        condition: service_healthy

  app:
    build: . 
    
    env_file:
      - .env.docker
    ports:
      - "${PORT}:${PORT}"                   
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    command: npm start

volumes:
  postgres_data: